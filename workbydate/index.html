      async function fetchQuizesCasesByDate(
        url = "/currentDay/Wed__Feb_14__2024/",
      ) {
        try {
          let quizes = await getFirebaseNode({
            url: url + "posts",
            type: "array",
          });
          let cases = await getFirebaseNode({
            url: url + "cases",
            type: "array",
          });
          return [
            ...quizes.map((item) => ({ ...item, source: "posts" })),
            ...cases.map((item) => ({ ...item, source: "cases" })),

        } catch (err) {
          console.log(err);

            seedState({

                  [userEmail]: data,
                },

            }),
          );
          return data;
        }
        return null;

      // ============================================================
      //  Date selection handler

      async function doSelectDate(e) {
        destroyChart();
        e.preventDefault();

        const d = new Date(e.target.value);
        const currentDay = new Intl.DateTimeFormat("en", {
          weekday: "short",
          year: "numeric",
          month: "short",
          day: "numeric",
        })
          .format(new Date(d.getFullYear(), d.getMonth(), d.getDate()))
          .replace(/[^a-zA-Z0-9]/g, "_");

        const quizesbyDate = await fetchQuizesCasesByDate(
          "/currentDay/" + currentDay + "/",
        );
        const uniqueEmails = [
          ...new Set(quizesbyDate.map((item) => item?.email)),
        ];

        const updatedopenavatars = {};
        const values = await Promise.all(
          uniqueEmails.map((email) =>
            getAvatar(email.replace(/[^a-zA-Z0-9]/g, "_")),
          ),
        );

        const usedAvatars = [];
        uniqueEmails.forEach((email, index) => {
          const sanitized = email.replace(/[^a-zA-Z0-9]/g, "_");
          let avatarInfo = values[index];

          if (avatarInfo) {
            updatedopenavatars[sanitized] = avatarInfo;
            if (avatarInfo.avatarUrl) usedAvatars.push(avatarInfo.avatarUrl);
          } else {
            const quizuser =
              quizesbyDate.find((item) => item.email === email)?.user ||
              "John Doe";
            const avatarUrl = findImageByGender(
              "https://econolabs.github.io/",
              true,
              usedAvatars,
            );
            usedAvatars.push(avatarUrl);
            updatedopenavatars[sanitized] = {
              id: sanitized,
              avatarUrl,
              user: quizuser,
            };
          }
        });

        store.dispatch(
          seedState({ object:
             { openavatars: updatedopenavatars,
              quizesbyDate: quizesbyDate
              } }),
        );

        markupForQuizesCasesByDate(
          "cards",
          "cases",
          "budgeting",
          quizesbyDate,
          updatedopenavatars,
          "John Doe",
          "../freelancer.jpg",
        );
      }

      selectedDate.addEventListener("change", doSelectDate, false);

      // ------------------------------------------------------------------
      // Auth UI
      // ------------------------------------------------------------------
      const authModalEl = document.getElementById("authModal");
      const authModal = new bootstrap.Modal(authModalEl);
      const authForm = document.getElementById("authForm");
      const authEmail = document.getElementById("authEmail");
      const authPassword = document.getElementById("authPassword");
      const authError = document.getElementById("authError");
      const authSuccess = document.getElementById("authSuccess");
      const loginBtn = document.getElementById("loginBtn");
      const signUpBtn = document.getElementById("signUpBtn");
      const googleSignInBtn = document.getElementById("googleSignInBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const authStatus = document.getElementById("authStatus");
      const brandLoginBtn = document.getElementById("brandLoginBtn");

      function showError(msg) {
        authError.textContent = msg;
        authError.classList.remove("d-none");
        authSuccess.classList.add("d-none");
      }

      function showSuccess(msg) {
        authSuccess.textContent = msg;
        authSuccess.classList.remove("d-none");
        authError.classList.add("d-none");
      }

      function clearMessages() {
        authError.classList.add("d-none");
        authSuccess.classList.add("d-none");
      }

      // Open login modal when brand is clicked
      brandLoginBtn.addEventListener("click", (e) => {
        e.preventDefault();
        if (auth.currentUser) {
          return;
        }
        clearMessages();
        authModal.show();
      });

      // Login
      async function doLogin() {
        clearMessages();
        const email = authEmail.value.trim();
        const password = authPassword.value;
        if (!email || !password) {
          showError("Введите email и пароль.");
          return;
        }
        loginBtn.disabled = true;
        try {
          await logIn(email, password);
          authModal.hide();
        } catch (err) {
          console.error(err);
          const code = err?.code || "";
          if (
            code.includes("invalid-credential") ||
            code.includes("wrong-password") ||
            code.includes("user-not-found")
          ) {
            showError("Неверный email или пароль.");
          } else if (code.includes("too-many-requests")) {
            showError("Слишком много попыток. Попробуйте позже.");
          } else {
            showError(err?.message || "Ошибка входа.");
          }
        } finally {
          loginBtn.disabled = false;
        }
      }

      // Sign up
      async function doSignUp() {
        clearMessages();
        const email = authEmail.value.trim();
        const password = authPassword.value;
        if (!email || !password) {
          showError("Введите email и пароль для регистрации.");
          return;
        }
        if (password.length < 6) {
          showError("Пароль должен содержать не менее 6 символов.");
          return;
        }
        signUpBtn.disabled = true;
        try {
          await signUp(email, password);
          showSuccess("Аккаунт создан. Вы вошли.");
          setTimeout(() => authModal.hide(), 800);
        } catch (err) {
          console.error(err);
          const code = err?.code || "";
          if (code.includes("email-already-in-use")) {
            showError("Этот email уже зарегистрирован. Попробуйте войти.");
          } else if (code.includes("weak-password")) {
            showError("Слишком слабый пароль.");
          } else if (code.includes("invalid-email")) {
            showError("Некорректный email.");
          } else {
            showError(err?.message || "Ошибка регистрации.");
          }
        } finally {
          signUpBtn.disabled = false;
        }
      }

      // Google sign-in
      async function doGoogleSignIn() {
        clearMessages();
        googleSignInBtn.disabled = true;
        try {
          await googleSignIn();
          authModal.hide();
        } catch (err) {
          console.error(err);
          if (err?.code === "auth/popup-closed-by-user") {
            // user closed popup — ignore
          } else {
            showError(err?.message || "Ошибка входа через Google.");
          }
        } finally {
          googleSignInBtn.disabled = false;
        }
      }

      // Logout
      async function doLogout() {
        try {
          await logOut();
        } catch (err) {
          console.error(err);
        }
      }

      // Event listeners
      loginBtn.addEventListener("click", doLogin);
      signUpBtn.addEventListener("click", doSignUp);
      googleSignInBtn.addEventListener("click", doGoogleSignIn);
      logoutBtn.addEventListener("click", doLogout);

      // Submit on Enter inside form
      authForm.addEventListener("submit", (e) => {
        e.preventDefault();
        doLogin();
      });

      // Reflect auth state in navbar
      onAuthStateChanged(auth, (user) => {
        if (user) {
          authStatus.textContent = user.email || user.uid;
          logoutBtn.classList.remove("d-none");
          brandLoginBtn.textContent = "Econolabs";
        } else {
          authStatus.textContent = "";
          logoutBtn.classList.add("d-none");
          brandLoginBtn.textContent = "Econolabs";
        }
      });
    </script>
