<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformers.js - Translation</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0">🌐 Text Translation</h1>
                    </div>
                    <div class="card-body">
                        <p class="text-muted mb-4">
                            Translate text between languages using Transformers.js (runs locally in browser).
                        </p>

                        <div class="row g-3">
                            <!-- Source -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">From (English)</label>
                                <textarea id="inputText" class="form-control" rows="6" placeholder="Enter text in English...">
Hello, how are you today? I hope you're having a wonderful day.
                                </textarea>
                            </div>

                            <!-- Target -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">To (Spanish)</label>
                                <textarea id="outputText" class="form-control" rows="6" readonly placeholder="Translation will appear here..."></textarea>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button id="translateBtn" class="btn btn-primary btn-lg flex-grow-1">Translate to Spanish</button>
                            <button id="clearBtn" class="btn btn-outline-secondary btn-lg">Clear</button>
                        </div>

                        <div id="status" class="mt-3 text-info"></div>
                    </div>
                    <div class="card-footer text-muted small">
                        Powered by <a href="https://huggingface.co/docs/transformers.js" target="_blank">@huggingface/transformers</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Transformers.js -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0';

        let translator = null;

        async function loadTranslator() {
            if (!translator) {
                document.getElementById('status').textContent = 'Loading translation model... (first load may take 10-30s)';
                try {
                    translator = await pipeline('translation', 'Xenova/opus-mt-en-es');
                    document.getElementById('status').innerHTML = '<span class="text-success">Model loaded ✓</span>';
                } catch (e) {
                    document.getElementById('status').innerHTML = `<span class="text-danger">Error: ${e.message}</span>`;
                    console.error(e);
                }
            }
            return translator;
        }

        document.getElementById('translateBtn').addEventListener('click', async () => {
            const text = document.getElementById('inputText').value.trim();
            if (!text) {
                alert("Please enter text to translate.");
                return;
            }

            const statusEl = document.getElementById('status');
            const outputEl = document.getElementById('outputText');

            statusEl.textContent = 'Translating...';
            outputEl.value = '';

            const pipe = await loadTranslator();
            if (!pipe) return;

            try {
                const result = await pipe(text);
                outputEl.value = result[0].translation_text;
                statusEl.innerHTML = '<span class="text-success">Translation complete!</span>';
            } catch (err) {
                statusEl.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
            }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            document.getElementById('status').textContent = '';
        });
    </script>
</body>
</html>
