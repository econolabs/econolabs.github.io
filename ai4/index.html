<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformers.js - Question Answering</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow-sm">
                    <div class="card-header bg-info text-white">
                        <h1 class="h4 mb-0">❓ Question Answering</h1>
                    </div>
                    <div class="card-body">
                        <p class="text-muted mb-4">
                            Provide a context paragraph and ask questions. The model finds the answer in the text.
                        </p>

                        <!-- Context -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Context (Paragraph)</label>
                            <textarea id="contextText" class="form-control" rows="6" placeholder="Paste context here...">
The Eiffel Tower is a wrought-iron lattice tower on the Champ de Mars in Paris, France. It is named after the engineer Gustave Eiffel, whose company designed and built the tower. Constructed from 1887 to 1889, it was originally built as the entrance arch for the 1889 World's Fair. It is 324 metres tall and remains the tallest structure in Paris.
                            </textarea>
                        </div>

                        <!-- Question -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Your Question</label>
                            <input type="text" id="questionInput" class="form-control form-control-lg" placeholder="e.g. Who built the Eiffel Tower?" value="How tall is the Eiffel Tower?">
                        </div>

                        <div class="d-flex gap-2">
                            <button id="answerBtn" class="btn btn-info btn-lg flex-grow-1 text-white">Get Answer</button>
                            <button id="clearBtn" class="btn btn-outline-secondary btn-lg">Clear</button>
                        </div>

                        <div id="status" class="mt-3 text-info"></div>

                        <div id="outputCard" class="mt-4 card d-none border-info">
                            <div class="card-body">
                                <h5 class="card-title text-info">Answer</h5>
                                <div id="output" class="card-text fs-5 bg-light p-4 rounded border"></div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-muted small">
                        Powered by <a href="https://huggingface.co/docs/transformers.js" target="_blank">@huggingface/transformers</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Transformers.js -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0';

        let qaPipeline = null;

        async function loadQAPipeline() {
            if (!qaPipeline) {
                document.getElementById('status').textContent = 'Loading Question Answering model... (first load may take 15-35s)';
                try {
                    qaPipeline = await pipeline('question-answering', 'Xenova/distilbert-base-cased-distilled-squad');
                    document.getElementById('status').innerHTML = '<span class="text-success">Model ready ✓</span>';
                } catch (e) {
                    document.getElementById('status').innerHTML = `<span class="text-danger">Error: ${e.message}</span>`;
                    console.error(e);
                }
            }
            return qaPipeline;
        }

        document.getElementById('answerBtn').addEventListener('click', async () => {
            const context = document.getElementById('contextText').value.trim();
            const question = document.getElementById('questionInput').value.trim();

            if (!context || !question) {
                alert("Please provide both context and a question.");
                return;
            }

            const statusEl = document.getElementById('status');
            const outputCard = document.getElementById('outputCard');
            const outputEl = document.getElementById('output');

            outputCard.classList.add('d-none');
            statusEl.textContent = 'Finding answer...';

            const pipe = await loadQAPipeline();
            if (!pipe) return;

            try {
                const result = await pipe(question, context);
                outputEl.innerHTML = `
                    <strong>${result.answer}</strong><br>
                    <small class="text-muted">Confidence: ${(result.score * 100).toFixed(1)}%</small>
                `;
                outputCard.classList.remove('d-none');
                statusEl.textContent = '';
            } catch (err) {
                statusEl.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
            }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('questionInput').value = '';
            document.getElementById('outputCard').classList.add('d-none');
            document.getElementById('status').textContent = '';
        });
    </script>
</body>
</html>
