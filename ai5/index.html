<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformers.js - Text Generation</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h1 class="h4 mb-0">✍️ Text Generation</h1>
                    </div>
                    <div class="card-body">
                        <p class="text-muted mb-4">
                            Continue writing or generate text from a prompt using Transformers.js (runs in browser).
                        </p>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Your Prompt</label>
                            <textarea id="promptInput" class="form-control" rows="4" placeholder="Write a prompt here...">
The future of artificial intelligence is
                            </textarea>
                        </div>

                        <div class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label">Max Length</label>
                                <input type="number" id="maxLength" class="form-control" value="150" min="50" max="300">
                            </div>
                            <div class="col-md-8">
                                <button id="generateBtn" class="btn btn-dark btn-lg w-100">Generate Text</button>
                            </div>
                        </div>

                        <button id="clearBtn" class="btn btn-outline-secondary mt-3">Clear</button>

                        <div id="status" class="mt-3 text-info"></div>

                        <div id="outputCard" class="mt-4 card d-none border-dark">
                            <div class="card-body">
                                <h5 class="card-title">Generated Text</h5>
                                <div id="output" class="card-text bg-light p-4 rounded border fst-italic"></div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-muted small">
                        Powered by <a href="https://huggingface.co/docs/transformers.js" target="_blank">@huggingface/transformers</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Transformers.js -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0';

        let generator = null;

        async function loadGenerator() {
            if (!generator) {
                document.getElementById('status').textContent = 'Loading text generation model... (first load may take 15-40s)';
                try {
                    generator = await pipeline('text-generation', 'Xenova/distilgpt2');
                    document.getElementById('status').innerHTML = '<span class="text-success">Model ready ✓</span>';
                } catch (e) {
                    document.getElementById('status').innerHTML = `<span class="text-danger">Error: ${e.message}</span>`;
                    console.error(e);
                }
            }
            return generator;
        }

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                alert("Please enter a prompt.");
                return;
            }

            const statusEl = document.getElementById('status');
            const outputCard = document.getElementById('outputCard');
            const outputEl = document.getElementById('output');
            const maxLength = parseInt(document.getElementById('maxLength').value) || 150;

            outputCard.classList.add('d-none');
            statusEl.textContent = 'Generating...';

            const pipe = await loadGenerator();
            if (!pipe) return;

            try {
                const result = await pipe(prompt, {
                    max_new_tokens: maxLength,
                    temperature: 0.7,
                    top_p: 0.9,
                    do_sample: true,
                    num_return_sequences: 1
                });

                outputEl.textContent = result[0].generated_text;
                outputCard.classList.remove('d-none');
                statusEl.textContent = '';
            } catch (err) {
                statusEl.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
            }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('promptInput').value = '';
            document.getElementById('outputCard').classList.add('d-none');
            document.getElementById('status').textContent = '';
        });
    </script>
</body>
</html>
